[project]
name = "cann-cann"
version = "0.2.1"
description = "看看环境上的 NPU 参数"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[[project.authors]]
name = "liggest"

[project.urls]
Homepage = "https://github.com/liggest/cann-cann"
Repository = "https://github.com/liggest/cann-cann"
Issues = "https://github.com/liggest/cann-cann/issues"

[project.scripts]
cann-cann = "cann_cann.cli:main"
ccann = "cann_cann.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 140
exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.build-backend]
source-include = ["docs/**"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
