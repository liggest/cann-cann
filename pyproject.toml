[project]
name = "cann-cann"
version = "0.1.0"
description = "Inspect NPU platform configuration shipped with CANN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cann-cann = "cann_cann.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 140
exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
